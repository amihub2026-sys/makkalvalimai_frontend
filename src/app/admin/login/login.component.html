<div class="login-bg">
<div class="login-card glass">
<img src="assets/images/makkal-valimai-logo.png" alt="Makkal Valimai"/>
<span class="eyebrow">SECURE ADMIN ACCESS</span>
<h1>Admin Login</h1>
<p>மக்கள் வலிமை · Editor Dashboard</p>
<form (ngSubmit)="login()">
<label>Email<input type="email" name="email" [(ngModel)]="email" required autocomplete="username"/>
</label>
<label>Password<input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password"/>
</label>
<p class="form-error" *ngIf="error">{{error}}</p>
<button class="btn btn-red wide" type="submit" [disabled]="submitting">{{submitting ? "Signing in…" : "Login"}} <i class="fa-solid fa-arrow-right">
</i>
</button>
</form>

<a routerLink="/">← Back to public website</a>
</div>
</div>
